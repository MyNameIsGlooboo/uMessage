# Robolectric settings for every test under app/src/test.
#
# SDK 34: Robolectric needs JDK 21 to run SDK 35+, and this project builds and tests on JDK 17. Override per class
# with @Config(sdk = [...]) only if a test truly needs a newer framework and the machine runs JDK 21.
sdk=34
# A plain Application instead of the app's App class: App.onCreate installs the spam engine and starts a background
# thread that replays the pending-SMS queue and reschedules messages, which would race every test. A test that needs
# the real App can opt in with @Config(application = App::class).
application=android.app.Application
# Every test gets the recording SmsManager: Robolectric keeps one SmsManager per sandbox, so a shadow registered
# only on some test classes would not reliably apply.
shadows=com.glooboo.umessage.testing.ShadowRecordingSmsManager
