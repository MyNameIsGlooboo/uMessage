name: CI

# I28: a branch with an open pull request is built once (by the pull request), not twice; pushes build main only.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fails when gradle/wrapper/gradle-wrapper.jar is not an official Gradle release, so a pull request can't swap
  # the wrapper for one that runs its own code. The other jobs only start once it passed.
  wrapper-validation:
    name: Gradle wrapper is genuine
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

  build:
    name: Debug build, unit tests, lint
    needs: wrapper-validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      # testFossDebugUnitTest runs every test under app/src/test: plain JVM tests and the Robolectric ones (Room
      # migrations, DAOs, Compose UI). Robolectric fetches its android-all-instrumented jar for SDK 34 from Maven
      # Central on first use and caches it under ~/.m2, restored by the cache step below.
      - name: Cache Robolectric android-all jars
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml', 'app/src/test/resources/robolectric.properties') }}

      # Lint aborts on any error that is not in app/lint-baseline.xml (warnings are reported, never fatal) and
      # detekt fails on any finding that is not in app/detekt-baseline.xml (QD-23, SB-35).
      - name: Build, unit test, lint, detekt
        run: ./gradlew assembleFossDebug testFossDebugUnitTest lintFossDebug detekt --stacktrace

      # PF4: the Google Play variant is built and tested on every push too, so a break in src/gplay or in the
      # stripped forwarding code shows up here and not when a tag is already public.
      - name: Build and unit test the Google Play variant
        run: ./gradlew assembleGplayDebug testGplayDebugUnitTest --stacktrace

      - name: Locate debug APK
        id: apk
        run: |
          apk="$(ls app/build/outputs/apk/foss/debug/*.apk | head -n1)"
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      # Privacy gate: uMessage is fully offline. The build fails if the APK
      # (merged manifest, so it includes every library's permissions) requests
      # android.permission.INTERNET. Uses `aapt2 dump permissions`.
      - name: Fail if APK requests INTERNET
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          export PATH="$ANDROID_HOME/build-tools/36.0.0:$PATH"
          bash scripts/check-no-internet.sh "$APK_PATH"

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: umessage-debug-apk
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error

      - name: Upload test, lint and detekt reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reports
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
            app/build/reports/lint-results-*.html
            app/build/reports/detekt/**
          if-no-files-found: ignore

  release-build:
    # Builds the release variant exactly as a tag would (R8 minify + resource
    # shrinking), unsigned, so shrinker breakage shows up on every push instead
    # of only when a release is cut.
    name: Release build (minified, unsigned), lint
    needs: wrapper-validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # checkFdroidFossRelease (app/build.gradle.kts): the merged foss release manifest has no INTERNET permission
      # and the foss runtime classpath has no Google Play services, Firebase or other proprietary library.
      - name: Build release APK, lint release, F-Droid checks
        run: ./gradlew assembleFossRelease lintFossRelease checkFdroidFossRelease --stacktrace

      - name: Fail if release APK requests INTERNET
        run: |
          export PATH="$ANDROID_HOME/build-tools/36.0.0:$PATH"
          bash scripts/check-no-internet.sh "$(ls app/build/outputs/apk/foss/release/*.apk | head -n1)"

      - name: Upload R8 mapping and lint report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-build-reports
          path: |
            app/build/outputs/mapping/fossRelease/**
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore
