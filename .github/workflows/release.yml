name: Release

# Push a tag such as v0.2.0 to build signed foss and gplay releases (APK and AAB) and publish a GitHub Release.
# Signing needs these repository secrets:
#   SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD
# If any of them is missing the job fails before building. An unsigned APK is never published.
#
# Supply chain (SB-36): this is the only workflow that sees the signing secrets. It runs only for tags pushed to
# this repository, never for pull requests (forks included), every action is pinned to a full commit SHA so a
# moved tag can't swap the code that runs next to the keystore, the Gradle wrapper is checked against Gradle's
# official checksums, gradle-wrapper.properties pins the distribution's SHA-256, and the Gradle cache is not used
# (a cache written by another branch's build can't feed this one).
#
# Gates (QD-26), in order: the "checks" job, which never sees a secret, checks that the tag matches VERSION_NAME
# and that VERSION_CODE is higher than at the previous v* tag, then runs detekt, lint, the unit tests and the
# F-Droid checks. Only when all of that passed does the "release" job decode the keystore, build and sign, verify
# every signature with apksigner (APKs) and jarsigner (AABs), check the APKs ask for no INTERNET permission, and
# publish the files with a SHA256SUMS.txt.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  checks:
    name: Version, detekt, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The whole history and the tags, to compare VERSION_CODE with the previous release tag.
          fetch-depth: 0

      - uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Tag matches the version
        env:
          TAG: ${{ github.ref_name }}
        run: bash scripts/check-release-version.sh "$TAG"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          cache-disabled: true

      # No secret or keystore exists in this job, so test code and its dependencies never see them.
      - name: Detekt, lint, unit tests, F-Droid checks
        run: ./gradlew detekt lintFossDebug testFossDebugUnitTest checkFdroidFossRelease --stacktrace

  release:
    name: Build, sign, verify, publish
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      # Secrets reach the shell only through env, never through ${{ }} inside a script,
      # so quotes or "$" in a password cannot break or inject into the command.
      - name: Check signing secrets
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$SIGNING_KEYSTORE_BASE64" ] || missing="$missing SIGNING_KEYSTORE_BASE64"
          [ -n "$SIGNING_STORE_PASSWORD" ] || missing="$missing SIGNING_STORE_PASSWORD"
          [ -n "$SIGNING_KEY_ALIAS" ] || missing="$missing SIGNING_KEY_ALIAS"
          [ -n "$SIGNING_KEY_PASSWORD" ] || missing="$missing SIGNING_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing signing secrets:$missing. Refusing to publish an unsigned release."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          cache-disabled: true

      - name: Decode keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed foss and gplay APKs and AABs
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: >-
          ./gradlew assembleFossRelease assembleGplayRelease bundleFossRelease bundleGplayRelease
          --stacktrace

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Collect release files
        run: |
          set -euo pipefail
          mkdir -p dist
          for flavor in foss gplay; do
            apks=(app/build/outputs/apk/"$flavor"/release/*.apk)
            aabs=(app/build/outputs/bundle/"$flavor"Release/*.aab)
            [ "${#apks[@]}" -eq 1 ] && [ -f "${apks[0]}" ] || { echo "::error::Expected one $flavor APK: ${apks[*]}"; exit 1; }
            [ "${#aabs[@]}" -eq 1 ] && [ -f "${aabs[0]}" ] || { echo "::error::Expected one $flavor AAB: ${aabs[*]}"; exit 1; }
            case "${apks[0]}" in
              *-unsigned.apk) echo "::error::Release APK is unsigned: ${apks[0]}"; exit 1 ;;
            esac
            cp "${apks[0]}" "${aabs[0]}" dist/
          done
          ls -l dist

      - name: Verify signatures
        run: |
          set -euo pipefail
          for apk in dist/*.apk; do
            echo "== $apk"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          done
          # apksigner does not read app bundles; an AAB is signed like a JAR. Without -strict, because a
          # self-signed release key is reported as an untrusted chain, which is expected.
          for aab in dist/*.aab; do
            echo "== $aab"
            out="$(jarsigner -verify "$aab")"
            echo "$out"
            echo "$out" | grep -q "^jar verified" || { echo "::error::AAB is not signed: $aab"; exit 1; }
          done

      - name: Fail if an APK requests INTERNET
        run: |
          export PATH="$ANDROID_HOME/build-tools/36.0.0:$PATH"
          for apk in dist/*.apk; do bash scripts/check-no-internet.sh "$apk"; done

      - name: SHA-256 checksums
        working-directory: dist
        run: |
          sha256sum *.apk *.aab > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/*.apk
            dist/*.aab
            dist/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
