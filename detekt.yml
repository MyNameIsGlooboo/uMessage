build:
  maxIssues: 0
  weights:
    complexity: 2
    LongParameterList: 2
    style: 1

processors:
  active: true
  exclude:
    - "FunctionCountProcessor"
    - "PropertyCountProcessor"

config:
  validation: true

complexity:
  LongParameterList:
    active: true
    functionThreshold: 10
    constructorThreshold: 8
    ignoreDefaultParameters: true
    ignoreAnnotated:
      - "Composable"
  LongMethod:
    active: true
    threshold: 120
    ignoreAnnotated:
      - "Composable"
      - "Preview"

style:
  MagicNumber:
    active: true
    ignoreAnnotated: ["Composable"]
    ignoreEnums: true
    ignoreNumbers: ["-1", "0", "1", "2", "42", "128", "256", "1000"]
    # The theme files are the design tokens themselves (colour hex values, tone steps, type sizes): naming every
    # number there would only repeat it. Test sources are excluded by detekt's default as well.
    excludes: ["**/test/**", "**/androidTest/**", "**/ui/theme/ThemePresets.kt", "**/ui/theme/Tones.kt",
               "**/ui/theme/UMessageTheme.kt", "**/ui/theme/Type.kt"]
  MaxLineLength:
    active: true
    maxLineLength: 120
    excludePackageStatements: true
    excludeImportStatements: true
  ReturnCount:
    active: true
    max: 4
    excludeGuardClauses: true
    excludes: ["**/test/**", "**/androidTest/**"]

  # Compose previews are private functions only the IDE calls.
  UnusedPrivateMember:
    active: true
    ignoreAnnotated: ["Preview"]

naming:
  FunctionNaming:
    active: true
    ignoreAnnotated: ["Composable", "Preview"]
    functionPattern: "[a-z][A-Za-z0-9]*"

Compose: # io.nlopez.compose.rules
  ComposableParametersOrdering:
    active: true
  ModifierDefaultValue:
    active: true
  MissingModifierDefaultValue:
    active: true
  PublicComposablePreview:
    active: true
